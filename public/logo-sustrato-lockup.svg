<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 48" fill="none" role="img" aria-label="sustrato.ai">
  <!-- Lockup horizontal: isotipo + wordmark.
       El texto usa Plus Jakarta Sans, la tipografía del sitio, con fallback de sistema.
       Para uso fuera de la web (impresión, redes) conviene vectorizar el texto a paths. -->
  <defs>
    <radialGradient id="lk-halo">
      <stop offset="0" stop-color="#FF2A1E" stop-opacity="0.42" />
      <stop offset="0.5" stop-color="#E10600" stop-opacity="0.15" />
      <stop offset="1" stop-color="#E10600" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lk-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#FF4A3D" />
      <stop offset="1" stop-color="#C10500" />
    </radialGradient>
    <linearGradient id="lk-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0" />
      <stop offset="0.5" stop-color="#C10500" stop-opacity="1" />
      <stop offset="1" stop-color="#E10600" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lk-spill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10600" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FF2A1E" stop-opacity="0.38" />
      <stop offset="1" stop-color="#E10600" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lk-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E10600" stop-opacity="0.42" />
      <stop offset="1" stop-color="#E10600" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <circle cx="24" cy="14" r="16" fill="url(#lk-halo)" />
  <path d="M20.5,19 L27.5,19 L31,32.6 L17,32.6 Z" fill="url(#lk-cone)" />
  <ellipse cx="24" cy="33.6" rx="23" ry="5.4" fill="url(#lk-spill)" />
  <rect x="2" y="32" width="44" height="3.4" rx="1.7" fill="url(#lk-beam)" />
  <rect x="6" y="38.2" width="36" height="1.8" rx="0.9" fill="currentColor" opacity="0.24" />
  <rect x="11" y="42.2" width="26" height="1.4" rx="0.7" fill="currentColor" opacity="0.12" />
  <circle cx="24" cy="14" r="8" fill="url(#lk-core)" />

  <text
    x="62"
    y="32"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="-0.8"
    fill="currentColor"
  >sustrato<tspan fill="#E10600">.ai</tspan></text>
</svg>
